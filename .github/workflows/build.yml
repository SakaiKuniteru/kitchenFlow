name: KitchenFlow Build

on:
  push:
    branches:
      - development
      - production

  pull_request:
    branches:
      - development
      - production

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build templates
        run: npm run build:templates

      - name: Verify Product 1 assets
        env:
          APP_ENV: product1
          APP_VERSION: CI
        run: |
          node src/scripts/build-production.js
          test -f src/public/assets/dist/product1/manifest.json

      - name: Verify Product 2 assets
        env:
          APP_ENV: product2
          APP_VERSION: CI
        run: |
          node src/scripts/build-production.js
          test -f src/public/assets/dist/product2/manifest.json